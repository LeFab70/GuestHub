server:
  port: 8080

spring:
  application:
    name: guest-hub-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/guesthub
    username: guesthub
    password: guesthub
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/guesthub

keycloak:
  realm: guesthub
  auth-server-url: http://localhost:8080
  ssl-required: external
  resource: guest-hub-backend
  credentials:
    secret: your-secret-key
  use-resource-role-mappings: true
  cors: true

logging:
  level:
    com.guesthub: DEBUG
    org.springframework.security: DEBUG
